name: Publish LT72 Air Alert release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"
      - "custom_components/lt72_air_alert/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'braticks/lt72-air-alert'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/lt72_air_alert/manifest.json"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "LT72 Air Alert $TAG" \
            --notes "LT72 Air Alert $TAG: recognize the official LT72 no-active-event homepage banner without claiming any county is safe. If individual county status is not published, the sensor reports Nepaskelbta. This unofficial integration does not replace official LT-Alert notices."
